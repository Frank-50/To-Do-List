
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="tela_login_and_cadastro.css">
</head>
<body class="pagina_login">
    
   
    <div class="conteiner_login">

        <fieldset>

            <h1>Login</h1>

            <form>
                <label for="nome_user">Username</label>
                <input type="text" id="nome_user" name="nome_user">
                <br>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email">
                <br>
                <label for="senha">password</label>
                <input type="password" id="senha" name="senha">
                <button type="button" id="exibir">exibir</button>
                <br><br>
                <div class="conteiner_botao">
                    <button type="submit">Login</button>
                    <button type="reset">Limpar fomulario</button>

                </div>
                
            </form>
            <br>
            <p>Ainda não tenho conta? <a href="tela_cadastro.html">Cadastra</a></p>
        </fieldset>
    </div>

    <script>
        const input = document.getElementById("senha")
        const botao = document.getElementById("exibir")

        botao.addEventListener("click", () => {
            if (input.type === "password") {
                input.type = "text";
                botao.textContent = "Ocultar";
            } else {
                input.type = "password";
                botao.textContent = "exibir";
            }
        });
    </script>
</body>
</html>
